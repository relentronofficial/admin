name: Force redeploy to production (one click)

# Actions → "Force redeploy to production (one click)" → Run workflow → type "deploy".
#
# Forces production to redeploy the current main branch even if no code
# changed since the last push. Useful after a Cloud Run config change,
# a secret rotation, or a rollback recovery.
#
# Production deploys automatically on every push to main (via ci-cd.yml).
# Use this only when you need a manual re-trigger without a code change.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to force redeploy main to production'
        required: true

permissions:
  actions: write

# One redeploy at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  redeploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Summarise what will be redeployed
        run: |
          {
            echo "## Force redeploying main to production"
            echo
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo "Triggered by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger CI/CD on main (workflow_dispatch forces all services)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci-cd.yml --ref main
          echo "Started CI/CD on main — follow it under Actions → CI/CD." >> "$GITHUB_STEP_SUMMARY"
