name: Grant Secret Manager Access (one-time setup)

on:
  workflow_dispatch:

env:
  GCP_PROJECT: tbt-lms-platform

jobs:
  grant-iam:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Grant Secret Manager Accessor role to deploy SA
        run: |
          gcloud projects add-iam-policy-binding $GCP_PROJECT \
            --member="serviceAccount:github-actions@tbt-lms-platform.iam.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor"
