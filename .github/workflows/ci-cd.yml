name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # One-click deploy: Actions → CI/CD → "Run workflow" → pick main.
  # A manual run deploys every part (backend + user-web + admin) regardless
  # of what paths changed, and still runs every build/typecheck/test gate first.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT: tbt-lms-platform
  GCP_REGION: asia-south1

jobs:
  # ── Build & typecheck admin + backend (all branches) ──────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tbt-admin
    outputs:
      # Manual runs (workflow_dispatch) always deploy; pushes deploy only what changed.
      backend_changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'tbt-admin/backend/**'
              - 'tbt-admin/package*.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tbt-admin/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        working-directory: tbt-admin/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate

      - name: Backend unit tests (incl. schema guard)
        run: npm test

      - name: Build Backend
        run: npm run build:backend

      - name: Build Admin Panel
        run: npm run build:admin

  # ── Build & typecheck user-web (all branches) ────────────────────────────
  build-user-web:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.user_web }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            user_web:
              - 'tbt-user-web/**'

      - name: Setup Node.js
        if: steps.filter.outputs.user_web == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tbt-user-web/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.user_web == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: tbt-user-web
        run: npm ci

      - name: Typecheck
        if: steps.filter.outputs.user_web == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: tbt-user-web
        env:
          NEXT_PUBLIC_API_URL: https://tbt-backend-464464507912.asia-south1.run.app
          NEXT_PUBLIC_APP_URL: https://app.tamilbusinesstribe.com
        run: npm run typecheck

  # ── Deploy production backend (main branch) ──────────────────────────────
  deploy-backend-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && needs.build-and-test.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Additive-only schema sync — see the staging job above for why.
      - name: Apply database schema (production) — additive only, guarded
        working-directory: tbt-admin/backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --script > schema-diff.sql
          npx tsx scripts/schema-guard.ts schema-diff.sql schema-apply.sql
          if [ -s schema-apply.sql ]; then
            npx prisma db execute --url "$DIRECT_URL" --file schema-apply.sql
          fi

      - name: Deploy to Cloud Run (production)
        run: |
          gcloud run deploy tbt-backend \
            --source tbt-admin/backend \
            --region $GCP_REGION \
            --project $GCP_PROJECT \
            --set-secrets="DATABASE_URL=prod-DATABASE_URL:latest,DIRECT_URL=prod-DIRECT_URL:latest,SUPABASE_URL=prod-SUPABASE_URL:latest,SUPABASE_ANON_KEY=prod-SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_KEY=prod-SUPABASE_SERVICE_KEY:latest,CLERK_SECRET_KEY=prod-CLERK_SECRET_KEY:latest,CLERK_PUBLISHABLE_KEY=prod-CLERK_PUBLISHABLE_KEY:latest,CLOUDFLARE_R2_ACCOUNT_ID=prod-CLOUDFLARE_R2_ACCOUNT_ID:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=prod-CLOUDFLARE_R2_ACCESS_KEY_ID:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=prod-CLOUDFLARE_R2_SECRET_ACCESS_KEY:latest,CLOUDFLARE_R2_BUCKET_NAME=prod-CLOUDFLARE_R2_BUCKET_NAME:latest,BUNNY_STREAM_LIBRARY_ID=prod-BUNNY_STREAM_LIBRARY_ID:latest,BUNNY_STREAM_API_KEY=prod-BUNNY_STREAM_API_KEY:latest,BUNNY_STORAGE_ACCESS_KEY=prod-BUNNY_STORAGE_ACCESS_KEY:latest,UPSTASH_REDIS_URL=prod-UPSTASH_REDIS_URL:latest,UPSTASH_REDIS_TOKEN=prod-UPSTASH_REDIS_TOKEN:latest,UPSTASH_REDIS_REST_URL=prod-UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=prod-UPSTASH_REDIS_REST_TOKEN:latest,JWT_ACCESS_SECRET=prod-JWT_ACCESS_SECRET:latest,MSG91_AUTH_KEY=prod-MSG91_AUTH_KEY:latest,MSG91_SENDER_ID=prod-MSG91_SENDER_ID:latest,MSG91_TEMPLATE_ID=prod-MSG91_TEMPLATE_ID:latest,WABA_ACCESS_TOKEN=prod-WABA_ACCESS_TOKEN:latest,WABA_PHONE_NUMBER_ID=prod-WABA_PHONE_NUMBER_ID:latest,WABA_FROM_NUMBER=prod-WABA_FROM_NUMBER:latest,WABA_TEMPLATE_NAME=prod-WABA_TEMPLATE_NAME:latest,WABA_TEMPLATE_LANGUAGE=prod-WABA_TEMPLATE_LANGUAGE:latest,WABA_API_BASE_URL=prod-WABA_API_BASE_URL:latest,ADMIN_WHATSAPP_NUMBER=prod-ADMIN_INTAKE_NUMBER:latest,GITHUB_TOKEN=prod-GITHUB_TOKEN:latest,SENTRY_DSN=prod-SENTRY_DSN:latest,LIVEKIT_WS_URL=prod-LIVEKIT_WS_URL:latest,LIVEKIT_API_KEY=prod-LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=prod-LIVEKIT_API_SECRET:latest,RAZORPAY_KEY_SECRET=prod-RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=prod-RAZORPAY_WEBHOOK_SECRET:latest" \
            --set-env-vars="^|^NODE_ENV=production|WABA_WEBHOOK_SECRET=${{ secrets.WABA_WEBHOOK_SECRET }}|USER_WEB_URL=https://app.tamilbusinesstribe.com|ADMIN_WEB_URL=https://v0-tbt-ott-admin.vercel.app|BUNNY_CDN_URL=tamil-business-tribe-cdn.b-cdn.net|BUNNY_STORAGE_HOSTNAME=sg.storage.bunnycdn.com|BUNNY_STORAGE_ZONE=tamil-business-tribe|CORS_EXTRA_ORIGINS=https://tbt-user-web-464464507912.asia-south1.run.app,https://tbt-admin-464464507912.asia-south1.run.app|RAZORPAY_KEY_ID=rzp_live_RDQWFy37zMYb8A|MENTORSHIP_DEMO_MEMBER_ID=${{ secrets.MENTORSHIP_DEMO_MEMBER_ID }}|MENTORSHIP_DEMO_EMAIL=${{ secrets.MENTORSHIP_DEMO_EMAIL }}" \
            --min-instances=1 \
            --quiet

  # ── Deploy production user-web (main branch) ─────────────────────────────
  # Cloud Run is the user-web host (app.tamilbusinesstribe.com is served by
  # tbt-user-web). Each new revision gets no traffic until the bundle it
  # actually serves is checked against the expected backend — see
  # .github/scripts/verify-user-web-target.sh.
  deploy-user-web-production:
    needs: [build-user-web, deploy-backend-production]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-user-web.result == 'success' && needs.build-user-web.outputs.changed == 'true' && needs.deploy-backend-production.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE: tbt-user-web
      API_URL: https://tbt-backend-464464507912.asia-south1.run.app
      SITE_ORIGIN: https://app.tamilbusinesstribe.com
    steps:
      - uses: actions/checkout@v4

      - name: Check the backend this build will use
        run: |
          bash .github/scripts/verify-user-web-target.sh config production "$API_URL"
          bash .github/scripts/verify-user-web-target.sh cors "$API_URL" "$SITE_ORIGIN"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Clerk publishable key from GCP Secret Manager
        run: |
          CLERK_PK=$(gcloud secrets versions access latest --secret="prod-CLERK_PUBLISHABLE_KEY" --project=$GCP_PROJECT)
          echo "CLERK_PK=$CLERK_PK" >> $GITHUB_ENV

      # See the staging job: read by tbt-user-web/Dockerfile. Public values only.
      - name: Write build-time env for the Dockerfile
        run: |
          cat > tbt-user-web/.ci-build-env <<EOF
          NEXT_PUBLIC_API_URL='$API_URL'
          NEXT_PUBLIC_APP_URL='$SITE_ORIGIN'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY='$CLERK_PK'
          NEXT_PUBLIC_CLERK_SIGN_IN_URL='/login'
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL='/community'
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL='/community'
          NEXT_PUBLIC_RAZORPAY_KEY_ID='rzp_live_RDQWFy37zMYb8A'
          EOF

      - name: Deploy user-web to Cloud Run (production) — no traffic yet
        run: |
          gcloud run deploy $SERVICE \
            --source tbt-user-web \
            --region $GCP_REGION \
            --project $GCP_PROJECT \
            --port=3000 \
            --allow-unauthenticated \
            --memory=512Mi \
            --min-instances=1 \
            --set-env-vars="NODE_ENV=production" \
            --no-traffic \
            --tag=candidate \
            --quiet

      - name: Verify the new revision calls only the production backend
        run: |
          CANDIDATE_URL=$(gcloud run services describe $SERVICE --region $GCP_REGION --project $GCP_PROJECT --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          bash .github/scripts/verify-user-web-target.sh bundle "$CANDIDATE_URL" "$API_URL"

      - name: Route traffic to the new revision
        run: gcloud run services update-traffic $SERVICE --to-latest --region $GCP_REGION --project $GCP_PROJECT --quiet

      # Optional mirror to the v0-tbt-ott-user-web Vercel project. Cloud Run is
      # the host, so a Vercel failure (e.g. its 100 deployments/day free-plan
      # limit) must not fail the deploy.
      - name: Install Vercel CLI
        continue-on-error: true
        run: npm install -g vercel@latest

      - name: Deploy user-web to Vercel (production, non-blocking mirror)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_USER_WEB_PROJECT_ID }}
        run: |
          vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_API_URL="$API_URL" \
            --build-env NEXT_PUBLIC_APP_URL=https://app.tamilbusinesstribe.com \
            --build-env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ env.CLERK_PK }}" \
            --build-env NEXT_PUBLIC_CLERK_SIGN_IN_URL=/login \
            --build-env NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/community \
            --build-env NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/community \
            --build-env NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_RDQWFy37zMYb8A

  # ── Deploy production admin panel (main branch) ──────────────────────────
  deploy-admin-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Clerk publishable key from GCP Secret Manager
        run: |
          CLERK_PK=$(gcloud secrets versions access latest --secret="prod-CLERK_PUBLISHABLE_KEY" --project=$GCP_PROJECT)
          echo "CLERK_PK=$CLERK_PK" >> $GITHUB_ENV

      - name: Deploy admin panel to Cloud Run (production)
        run: |
          gcloud run deploy tbt-admin \
            --source tbt-admin/admin-panel \
            --region $GCP_REGION \
            --project $GCP_PROJECT \
            --port=3000 \
            --allow-unauthenticated \
            --memory=512Mi \
            --min-instances=1 \
            --set-build-env-vars="NEXT_PUBLIC_API_URL=https://tbt-backend-464464507912.asia-south1.run.app,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.CLERK_PK }}" \
            --set-secrets="CLERK_SECRET_KEY=prod-CLERK_SECRET_KEY:latest" \
            --set-env-vars="NODE_ENV=production|NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.CLERK_PK }}|NEXT_PUBLIC_API_URL=https://tbt-backend-464464507912.asia-south1.run.app" \
            --quiet
