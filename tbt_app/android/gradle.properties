org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Serialize Kotlin daemons to avoid running multiple JVMs concurrently and
# exhausting the Windows commit limit (errno 1455). One worker is enough
# on a memory-tight box; slower but reliable.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=true
# Cap Kotlin daemon separately (it forks its own JVM, not covered by jvmargs).
kotlin.daemon.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m

# Disable Kotlin incremental compilation. When the pub cache lives on a
# different drive from the project (e.g. C:\ vs F:\), Kotlin's
# RelocatableFileToPathConverter throws IllegalArgumentException because
# File.relativeTo() can't cross Windows drive letters. Turning incremental
# off bypasses that code path.
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=true
