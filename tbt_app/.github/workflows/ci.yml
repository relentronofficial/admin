# GitHub Actions CI — TBT Flutter App
#
# Jobs:
#   analyze            — dart analyze (all branches / PRs)
#   test               — unit + widget tests with coverage threshold (all branches / PRs)
#   integration-test   — Patrol UI tests on Android emulator (push to main only)
#   build-android      — signed release AAB → Firebase App Distribution (push to main only)
#   build-ios          — iOS no-codesign build check (push to main only)
#
# Required repository secrets (Settings → Secrets → Actions):
#   STAGING_API_URL            e.g. https://tbt-backend-staging-xxxxx.a.run.app
#   PROD_API_URL               e.g. https://tbt-backend-xxxxx.a.run.app
#   GOOGLE_SERVICES_JSON       base64-encoded android/app/google-services.json
#   GOOGLE_SERVICE_INFO_PLIST  base64-encoded ios/Runner/GoogleService-Info.plist
#   KEYSTORE_BASE64            base64-encoded android/app/release.keystore
#   KEYSTORE_PASSWORD          Keystore store password
#   KEY_ALIAS                  Keystore key alias
#   KEY_PASSWORD               Keystore key password
#   FIREBASE_APP_ID            Android app ID from Firebase console (e.g. 1:123456:android:abc123)
#   FIREBASE_SERVICE_CREDENTIALS  Google service account JSON — raw content (NOT base64).
#                                 Grant it the "Firebase App Distribution Admin" IAM role.
#   APPLE_API_KEY_ID           App Store Connect API key ID (10-char alphanumeric)
#   APPLE_API_ISSUER_ID        Issuer UUID from App Store Connect → Users → Integrations
#   APPLE_API_KEY_CONTENT      Content of the .p8 file (raw, with header/footer lines)
#   APPLE_TEAM_ID              10-character Apple Developer team ID
#   DISTRIBUTION_CERTIFICATE_BASE64  base64-encoded .p12 distribution certificate
#   CERTIFICATE_PASSWORD       Password used when exporting the .p12
#   PROVISIONING_PROFILE_BASE64  base64-encoded App Store .mobileprovision file
#
# Firebase config and signing secrets are only needed by the build jobs.
# analyze and test run fine without them.
#
# To encode Firebase credentials:
#   base64 -i android/app/google-services.json         | pbcopy
#   base64 -i ios/Runner/GoogleService-Info.plist      | pbcopy
#
# To create the Android keystore:
#   keytool -genkey -v -keystore release.keystore -keyalg RSA \
#     -keysize 2048 -validity 10000 -alias tbt
#   base64 -i release.keystore | pbcopy   # then paste as KEYSTORE_BASE64 secret

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which API URL to bake into the build'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

# Cancel any in-progress run on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.2'

# ── Job 1: Static analysis ────────────────────────────────────────────────────

jobs:
  analyze:
    name: Dart analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze --no-pub

# ── Job 2: Unit & widget tests ────────────────────────────────────────────────

  test:
    name: Unit & widget tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Unit tests
        run: flutter test test/unit/ --no-pub --reporter expanded

      - name: Widget tests
        run: flutter test test/widget/ --no-pub --reporter expanded

      - name: Feature tests
        run: flutter test test/features/ --no-pub --reporter expanded

      - name: Collect coverage
        run: |
          flutter test test/unit/ test/widget/ test/features/ \
            --no-pub \
            --coverage \
            --reporter compact

      - name: Enforce coverage threshold (20 %)
        # Baseline set conservatively for a large mobile codebase with focused
        # unit tests. Raise incrementally as the test suite grows — aim for 40%
        # once widget tests cover the main feature screens.
        run: |
          sudo apt-get install -y lcov -q
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 \
            | grep -E "lines\.\.\.\.\." \
            | grep -oP '[0-9]+\.[0-9]+(?=%)' \
            | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "::warning::Could not parse coverage — skipping threshold check"
            exit 0
          fi
          THRESHOLD=20
          if awk "BEGIN{exit !($COVERAGE < $THRESHOLD)}"; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

# ── Job 3: Integration tests (main branch only) ───────────────────────────────

  integration-test:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - run: flutter pub get

      - name: Enable KVM (hardware acceleration for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            flutter test integration_test/ \
              --no-pub \
              --reporter expanded \
              --dart-define=API_BASE_URL=${{ secrets.STAGING_API_URL }}

# ── Job 4: Android release build (main branch only) ──────────────────────────

  build-android:
    name: Android release App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Write Android keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - run: flutter pub get

      - name: Resolve API base URL
        id: apiurl
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "url=${{ secrets.PROD_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.STAGING_API_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release App Bundle
        run: |
          flutter build appbundle \
            --release \
            --no-pub \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ steps.apiurl.outputs.url }}

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testers
          file: build/app/outputs/bundle/release/app-release.aab
          releaseNotes: "Build #${{ github.run_number }} (${{ github.sha }}): ${{ github.event.head_commit.message }}"

# ── Job 5: iOS build + TestFlight (main branch only) ─────────────────────────

  build-ios:
    name: iOS IPA + TestFlight
    runs-on: macos-latest
    needs: [analyze, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Write Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update

      - name: Set up code signing
        env:
          CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create a temporary keychain so the cert doesn't pollute the login keychain
          security create-keychain -p "ci-temp" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-temp" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "ci-temp" build.keychain

          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(grep -a -A 1 "UUID" /tmp/profile.mobileprovision \
                   | grep -oE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision \
             ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

      - name: Resolve API base URL
        id: apiurl
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "url=${{ secrets.PROD_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.STAGING_API_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS IPA
        run: |
          flutter build ipa \
            --release \
            --no-pub \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ steps.apiurl.outputs.url }}

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_NOTES: "Build #${{ github.run_number }}: ${{ github.event.head_commit.message }}"
        run: |
          cd ios
          bundle install --quiet
          bundle exec fastlane beta
