name: tbt_app
description: Tamil Business Tribe — Flutter mobile application for Android and iOS.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Core ──────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0

  # ── UI & Design ───────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  lottie: ^3.1.3
  flutter_blurhash: ^0.8.2
  # Opts the Android activity into the display's highest supported
  # refresh rate (90 / 120 Hz on modern phones). Without this Flutter
  # is capped at 60 Hz on Android even on 120 Hz hardware — no cost on
  # 60 Hz devices, huge fluency win on 120 Hz ones.
  flutter_displaymode: ^0.6.0

  # ── Video ─────────────────────────────────────────────────────────────────
  # better_player was abandoned in 2022 and does not declare the `namespace`
  # attribute required by AGP 8+. better_player_plus is a maintained fork with
  # an identical API — swap is import-only.
  better_player_plus: ^1.0.8
  webview_flutter: ^4.10.0
  video_player: ^2.9.2

  # ── Audio ─────────────────────────────────────────────────────────────────
  # just_audio for podcast playback. Chosen over audioplayers because
  # its background_playback + lockscreen integration story is more mature
  # and matches the co-worker's original implementation. If we later add
  # OS-level media-session controls (lockscreen play/pause), pair with
  # `audio_service` — not needed for the initial release.
  just_audio: ^0.9.42
  # record for hold-to-record voice notes in group + DM chats. Records
  # AAC-in-.m4a which is directly playable by just_audio / video_player.
  record: ^5.1.2

  # ── Chat / media viewer ───────────────────────────────────────────────────
  # scrollable_positioned_list lets us programmatically scroll to a
  # specific message index (for reply jump-to-parent).
  scrollable_positioned_list: ^0.3.8

  # ── PDF ───────────────────────────────────────────────────────────────────
  # flutter_pdfview for the in-app e-book reader. MIT-licensed (unlike
  # syncfusion_flutter_pdfviewer which needs a commercial license above the
  # community threshold). Provides native page-turn UX + onPageChanged
  # events which we hook into the /api/ebooks/progress endpoint to persist
  # the last-read page.
  flutter_pdfview: ^1.4.0
  http: ^1.2.2  # used to download PDFs to a local cache before opening

  # ── Real-time ─────────────────────────────────────────────────────────────
  socket_io_client: ^3.0.2
  livekit_client: ^2.4.0

  # ── Notifications ─────────────────────────────────────────────────────────
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

  # ── Splash ────────────────────────────────────────────────────────────────
  flutter_native_splash: ^2.4.3

  # ── Profile: QR code on the Membership Card back-face ─────────────────────
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  patrol: ^3.14.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  # For response_cache_test — transitive deps of hive_flutter that the test
  # references directly for a MockPlatformInterfaceMixin path provider.
  hive: ^2.2.3
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

# Launcher-icon generation. Source PNG is the TBT megaphone-T mark;
# adaptive icon paints the same foreground on a solid-black background
# so it looks consistent across Android launchers that mask/tint. Run
# `dart run flutter_launcher_icons` after changing image_path to
# regenerate every density + iOS size.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
